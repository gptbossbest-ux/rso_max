{% extends "base.html" %}
{% block title %}Диалоги с клиентами{% endblock %}
{% block head %}
<style>
.shift {display:flex;gap:8px;margin-bottom:14px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:8px 12px;border:1px solid var(--border);border-radius:7px;cursor:pointer}.tab.unread{border-color:var(--warning)}
.workspace{display:grid;grid-template-columns:260px 1fr;gap:14px}.profile,.chat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
.messages{height:430px;overflow:auto}.msg{margin:8px 0;padding:8px;border-radius:7px;background:var(--surface2)}.msg.operator{text-align:right;border-left:3px solid var(--accent)}
.composer{display:flex;gap:8px;margin-top:10px}.composer input[type=text]{flex:1}
</style>
{% endblock %}
{% block content %}
<h1>💬 Диалоги с клиентами</h1>
<div class="shift"><button class="btn btn-success" onclick="shift('start')">Начать смену</button><button class="btn btn-danger" onclick="shift('end')">Завершить смену</button><button class="btn btn-warning" onclick="transferAll()">Передать все диалоги</button><span id="shift-status"></span></div>
<div id="tabs" class="tabs"></div>
<div class="workspace"><div id="profile" class="profile">Выберите диалог</div><div class="chat"><div id="messages" class="messages"></div>
<form id="composer" class="composer" enctype="multipart/form-data"><input class="form-control" name="body" type="text" maxlength="3990" placeholder="Ответ клиенту"><input name="image" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"><button class="btn btn-primary">Отправить</button><button type="button" class="btn btn-danger" onclick="closeDialog()">Завершить</button></form></div></div>
<div class="card" style="margin-top:14px"><div class="card-header">Жалоба на клиента</div><div class="card-body"><select id="report-reason" class="form-control"><option value="unwanted_image">Нежелательное изображение</option><option value="insults">Оскорбления</option><option value="spam">Спам</option><option value="irrelevant_image">Изображение не относится к вопросу</option><option value="other">Другое</option></select><textarea id="report-comment" class="form-control" maxlength="2000" placeholder="Комментарий (обязателен для «Другое»)" style="margin-top:8px"></textarea><select id="report-image" class="form-control" style="margin-top:8px"><option value="">Без изображения</option></select><button class="btn btn-danger" style="margin-top:8px" onclick="reportClient()">Пожаловаться и закрыть диалог</button></div></div>
<script>
const csrf={{ csrf_token|tojson }};let dialogs=[];let current=null;let generation=0;
const cursors=new Map(),seen=new Map(),inFlight=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function clearCurrent(text='Выберите диалог'){generation++;for(const controller of inFlight.values())controller.abort();inFlight.clear();current=null;document.getElementById('profile').textContent=text;document.getElementById('messages').innerHTML='';document.getElementById('report-image').innerHTML='<option value="">Без изображения</option>'}
async function post(url,data=new FormData()){return fetch(url,{method:'POST',headers:{'X-CSRF-Token':csrf},body:data}).then(r=>r.json().then(j=>({ok:r.ok,...j})))}
async function shift(action){const r=await post(`/operator-chat/shift/${action}`);document.getElementById('shift-status').textContent=r.ok?'Готово':r.error}
async function transferAll(){if(!confirm('Передать все активные диалоги и завершить смену?'))return;const r=await post('/operator-chat/shift/transfer-all');document.getElementById('shift-status').textContent=r.ok?`Передано: ${r.transferred}`:r.error;if(r.ok){clearCurrent('Диалоги переданы.');await refresh()}}
async function refresh(){dialogs=await fetch('/operator-chat/api/dialogs').then(r=>r.json());const tabs=document.getElementById('tabs');tabs.innerHTML='';dialogs.forEach(d=>{const b=document.createElement('button');b.className='tab'+(d.unread?' unread':'');b.textContent=`Диалог №${d.id}${d.unread?' •':''}`;b.onclick=()=>select(d);tabs.appendChild(b)});if(current&&!dialogs.some(d=>d.id===current.id))clearCurrent('Диалог завершён.')}
function select(d){generation++;for(const controller of inFlight.values())controller.abort();inFlight.clear();current=d;cursors.set(d.id,0);seen.set(d.id,new Set());document.getElementById('messages').innerHTML='';document.getElementById('report-image').innerHTML='<option value="">Без изображения</option>';let ai=[];try{ai=JSON.parse(d.ai_context_json||'[]')}catch(e){}document.getElementById('profile').innerHTML=`<b>${esc(d.authenticated?(d.client_fio||'Клиент'):'Неавторизованный клиент')}</b><p>ЛС: ${esc(d.client_ls||'—')}</p><p>Адрес: ${esc(d.client_address||'—')}</p><p>FAQ: ${esc(d.faq_context||'—')}</p><p>ИИ: ${ai.map(x=>esc(x.text||'')).join('<br>')||'—'}</p>`;pollMessages()}
function renderMessage(m){const e=document.createElement('div');e.className=`msg ${m.sender}`;e.dataset.messageId=m.id;e.append(document.createTextNode((m.sender==='operator'?'Вы':m.sender==='client'?'Клиент':'Система')+': '+(m.body||'')));if(m.image_path){const i=document.createElement('img');i.src=`/operator-chat/images/${m.id}`;i.style.maxWidth='300px';e.appendChild(i);if(m.sender==='client'){const o=document.createElement('option');o.value=m.id;o.textContent=`Изображение #${m.id}`;document.getElementById('report-image').appendChild(o)}}if(m.sender==='operator'){const s=document.createElement('small');s.className='delivery';s.textContent=` [${m.delivery_status}]`;e.appendChild(s);if(m.delivery_status==='failed'){const b=document.createElement('button');b.className='btn btn-sm btn-warning';b.textContent='Повторить';b.onclick=()=>retryMessage(m.id,e);e.appendChild(b)}if(m.image_path&&m.delivery_status!=='delivered'){const d=document.createElement('button');d.className='btn btn-sm btn-danger';d.textContent='Удалить';d.onclick=()=>deleteMessage(m.id,e);e.appendChild(d)}}document.getElementById('messages').appendChild(e)}
function updateDelivery(m){const e=document.querySelector(`[data-message-id="${m.id}"]`);if(!e)return;const s=e.querySelector('.delivery');if(s)s.textContent=` [${m.delivery_status}]`;e.querySelectorAll('button').forEach(b=>b.remove());if(m.delivery_status==='failed'){const b=document.createElement('button');b.className='btn btn-sm btn-warning';b.textContent='Повторить';b.onclick=()=>retryMessage(m.id,e);e.appendChild(b)}if(m.image_path&&m.delivery_status!=='delivered'){const d=document.createElement('button');d.className='btn btn-sm btn-danger';d.textContent='Удалить';d.onclick=()=>deleteMessage(m.id,e);e.appendChild(d)}}
async function pollMessages(){if(!current)return;const dialogId=current.id;if(inFlight.has(dialogId))return;const myGeneration=generation;const controller=new AbortController();inFlight.set(dialogId,controller);try{const after=cursors.get(dialogId)||0;const response=await fetch(`/operator-chat/api/dialogs/${dialogId}/messages?after=${after}`,{signal:controller.signal});const ms=response.ok?await response.json():[];if(!current||current.id!==dialogId||generation!==myGeneration)return;const ids=seen.get(dialogId)||new Set();for(const m of ms){if(ids.has(m.id)){updateDelivery(m);continue}ids.add(m.id);cursors.set(dialogId,Math.max(cursors.get(dialogId)||0,m.id));renderMessage(m)}seen.set(dialogId,ids)}catch(e){if(e.name!=='AbortError')console.error(e)}finally{if(inFlight.get(dialogId)===controller)inFlight.delete(dialogId)}}
async function retryMessage(id,element){const r=await post(`/operator-chat/api/messages/${id}/retry`);const status=element.querySelector('.delivery');if(status)status.textContent=` [${r.delivery_status||'failed'}]`;if(r.delivered){const button=element.querySelector('button');if(button)button.remove()}else alert('Сообщение пока не доставлено. Повторите позже.')}
async function deleteMessage(id,element){if(!confirm('Удалить недоставленное изображение?'))return;const r=await post(`/operator-chat/api/messages/${id}/delete`);if(r.ok)element.remove();else alert(r.error||'Не удалось удалить изображение.')}
async function reportClient(){if(!current||!confirm('Жалоба немедленно завершит диалог. Продолжить?'))return;const data=new FormData();data.set('reason',document.getElementById('report-reason').value);data.set('comment',document.getElementById('report-comment').value);data.set('image_message_id',document.getElementById('report-image').value);const r=await post(`/operator-chat/api/dialogs/${current.id}/report`,data);if(!r.ok){alert(r.error||'Не удалось отправить жалобу.');return}clearCurrent('Диалог завершён по жалобе.');await refresh()}
document.getElementById('composer').onsubmit=async e=>{e.preventDefault();if(!current)return;const r=await post(`/operator-chat/api/dialogs/${current.id}/messages`,new FormData(e.target));if(r.ok){e.target.reset();await pollMessages();if(!r.delivered)alert('Сообщение сохранено, но пока не доставлено. Используйте кнопку «Повторить».')}else alert(r.error)};
async function closeDialog(){if(current&&confirm('Завершить диалог?')){const r=await post(`/operator-chat/api/dialogs/${current.id}/close`);if(!r.ok){alert(r.error||'Не удалось завершить диалог.');return}clearCurrent('Диалог завершён.');await refresh()}}
post('/operator-chat/heartbeat').then(()=>refresh());setInterval(()=>{post('/operator-chat/heartbeat');refresh();pollMessages()},10000);
</script>
{% endblock %}
