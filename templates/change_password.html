{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header"><strong>Обязательная смена пароля</strong></div>
  <div class="card-body">
    <form method="POST">
      <label>Новый пароль (не менее 12 символов)</label>
      <input type="password" name="password" minlength="12" required>
      <button type="submit" class="btn btn-primary">Сменить пароль</button>
    </form>
  </div>
</div>
{% endblock %}
