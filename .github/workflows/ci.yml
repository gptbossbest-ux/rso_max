name: CI

on:
  # For pull requests these patterns match the target branch, not the source.
  pull_request:
    branches:
      - main
      - Main_test
      - "integration/**"
      - "review/**"
  push:
    branches:
      - main
      - Main_test
      - "integration/**"
      - "review/**"

permissions:
  contents: read

jobs:
  fast:
    name: Fast tests
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/Main_test') ||
      (github.event_name == 'pull_request' && github.base_ref == 'Main_test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      DB_PATH: /tmp/rso-ci.sqlite
      LOG_FILE: /tmp/rso-ci.log
      SECRET_KEY: ci-only-secret-key-not-for-production-123456
      INTERNAL_API_TOKEN: ci-only-internal-api-token
      ALLOW_INSECURE_DEV_API: "false"
      ENABLE_1C_INTEGRATION: "false"
      INTEGRATION_1C_MOCK: "true"
      BOOTSTRAP_ADMIN_PASSWORD: ""
      TOKEN: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies from scratch
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Compile Python sources
        run: python -m compileall -q -f -x '(^|[\\/])(\.git|\.venv)([\\/]|$)' .

      # Temporary baseline: the legacy codebase is not yet clean under full Ruff.
      # These rules remain blocking because they catch syntax and undefined-name errors.
      - name: Run blocking Ruff baseline
        run: ruff check . --select E9,F63,F7,F82

  full:
    name: Full tests and security checks
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'pull_request' && startsWith(github.base_ref, 'integration/')) ||
      (github.event_name == 'pull_request' && startsWith(github.base_ref, 'review/')) ||
      startsWith(github.ref, 'refs/heads/integration/') ||
      startsWith(github.ref, 'refs/heads/review/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      DB_PATH: /tmp/rso-ci.sqlite
      LOG_FILE: /tmp/rso-ci.log
      SECRET_KEY: ci-only-secret-key-not-for-production-123456
      INTERNAL_API_TOKEN: ci-only-internal-api-token
      ALLOW_INSECURE_DEV_API: "false"
      ENABLE_1C_INTEGRATION: "false"
      INTEGRATION_1C_MOCK: "true"
      BOOTSTRAP_ADMIN_PASSWORD: ""
      TOKEN: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies from scratch
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Compile Python sources
        run: python -m compileall -q -f -x '(^|[\\/])(\.git|\.venv)([\\/]|$)' .

      - name: Run blocking Ruff baseline
        run: ruff check . --select E9,F63,F7,F82

      - name: Reject high-severity Bandit findings
        run: bandit -r . -x ./tests -lll

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --strict

  quality-gate:
    name: Tests and quality checks
    if: always()
    needs:
      - fast
      - full
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the branch-specific suite
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          FULL_RESULT: ${{ needs.full.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == push && "$REF_NAME" == refs/heads/Main_test ]]; then
            [[ "$FAST_RESULT" == success && "$FULL_RESULT" == skipped ]]
          elif [[ "$EVENT_NAME" == pull_request && "$BASE_REF" == Main_test ]]; then
            [[ "$FAST_RESULT" == success && "$FULL_RESULT" == skipped ]]
          else
            [[ "$FULL_RESULT" == success && "$FAST_RESULT" == skipped ]]
          fi
