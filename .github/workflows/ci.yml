name: CI

on:
  # For pull requests these patterns match the target branch, not the source.
  pull_request:
    branches:
      - main
      - "integration/**"
      - "review/**"
  push:
    branches:
      - main
      - "integration/**"
      - "review/**"

permissions:
  contents: read

jobs:
  quality:
    name: Tests and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DB_PATH: ${{ runner.temp }}/rso-ci.sqlite
      LOG_FILE: ${{ runner.temp }}/rso-ci.log
      SECRET_KEY: ci-only-secret-key-not-for-production-123456
      INTERNAL_API_TOKEN: ci-only-internal-api-token
      ALLOW_INSECURE_DEV_API: "false"
      ENABLE_1C_INTEGRATION: "false"
      INTEGRATION_1C_MOCK: "true"
      BOOTSTRAP_ADMIN_PASSWORD: ""
      TOKEN: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies from scratch
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Compile Python sources
        run: python -m compileall -q -f -x '(^|[\\/])(\.git|\.venv)([\\/]|$)' .

      # Temporary baseline: the legacy codebase is not yet clean under full Ruff.
      # These rules remain blocking because they catch syntax and undefined-name errors.
      - name: Run blocking Ruff baseline
        run: ruff check . --select E9,F63,F7,F82

      - name: Reject high-severity Bandit findings
        run: bandit -r . -x ./tests -lll

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --strict
